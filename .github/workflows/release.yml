name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ps2exe
        shell: powershell
        run: Install-Module ps2exe -Scope CurrentUser -Force

      - name: Build
        shell: powershell
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          .\Build-Release.ps1 -Version $version

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            GitHelper.exe
            GitHelper.zip
